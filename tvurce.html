<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>D3po.tv | Tvůrce</title>
  <meta property="og:title" content="D3po.tv — O tvůrci" />
  <meta property="og:description" content="Informace o tvůrci a autorech webu D3po.tv." />
  <meta name="theme-color" content="#07080c" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07080c;
      --bg-card: rgba(18, 20, 30, 0.72);
      --bg-card-solid: #12141e;
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.5);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-2: #06b6d4;
      --accent-3: #a855f7;
      --success: #10b981;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      animation: floatOrb 18s infinite alternate ease-in-out;
    }
    .orb-1 { width: 360px; height: 360px; background: #4f46e5; top: -90px; left: -70px; }
    .orb-2 { width: 320px; height: 320px; background: #0891b2; bottom: -70px; right: -50px; animation-delay: -7s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -50px) scale(1.15); }
    }

    .btn {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 13px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s, border-color 0.25s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: skewX(-22deg);
      transition: left 0.65s ease;
    }
    .btn:hover::after { left: 160%; }
    .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.11); border-color: rgba(255,255,255,0.22); }
    .btn:active { transform: scale(0.95); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #4f46e5, var(--accent-3));
      background-size: 200% 200%;
      border-color: transparent;
      color: #fff;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    #toast-container {
      position: fixed;
      bottom: 20px; right: 16px; left: 16px;
      max-width: 400px; margin-left: auto;
      z-index: 9000;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: rgba(16, 18, 28, 0.96);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 14px;
      font-size: 0.87rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      pointer-events: auto;
    }
    .toast.success { border-left-color: var(--success); }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 16px 80px;
    }

    header.navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      margin-bottom: 18px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
      font-weight: 800; font-size: 1.2rem;
    }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center; font-weight: 800; color: #fff;
    }

    .page-links-bar {
      display: flex; gap: 9px; overflow-x: auto;
      padding-bottom: 6px; margin-bottom: 22px;
      scrollbar-width: none;
    }
    .page-links-bar::-webkit-scrollbar { display: none; }
    .nav-pill {
      white-space: nowrap; text-decoration: none; color: var(--text);
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 9px 16px; border-radius: 999px;
      font-size: 0.88rem; font-weight: 600;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .nav-pill:hover, .nav-pill.active {
      background: rgba(99, 102, 241, 0.26);
      border-color: var(--border-glow);
      transform: translateY(-2px);
    }

    /* Karta tvůrce */
    .creator-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px 28px;
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.4);
      max-width: 650px;
      margin: 40px auto 0;
    }
    .creator-avatar {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-3));
      display: grid; place-items: center;
      font-size: 2.2rem;
      margin: 0 auto 20px;
      box-shadow: 0 8px 25px rgba(99,102,241,0.4);
    }
    .creator-card h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .credits-box {
      margin-top: 24px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .credit-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #a5b4fc;
    }

    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.84rem;
      color: var(--text-muted);
    }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div id="toast-container"></div>

  <div class="container">
    <header class="navbar">
      <a href="https://d3potv.github.io/depotv/" class="brand">
        <div class="brand-logo">D3</div>
        <span>D3po.tv</span>
      </a>
      <div>
        <a href="https://d3potv.github.io/depotv/" class="btn btn-primary btn-sm">Domů</a>
      </div>
    </header>

    <nav class="page-links-bar" aria-label="Hlavní navigace">
      <a class="nav-pill" href="https://d3potv.github.io/depotv/">🏠 Domů</a>
      <a class="nav-pill" href="https://d3potv.github.io/depotv/blogy">📝 Blogy</a>
      <a class="nav-pill" href="https://d3potv.github.io/depotv/projekty">🚀 Projekty</a>
      <a class="nav-pill" href="https://d3potv.github.io/depotv/odkazy">🔗 Odkazy</a>
      <a class="nav-pill active" href="https://d3potv.github.io/depotv/tvurce">👤 Tvůrce</a>
      <a class="nav-pill" href="https://d3potv.github.io/depotv/copyright">©️ Copyright</a>
    </nav>

    <main class="creator-card">
      <div class="creator-avatar">👑</div>
      <h1>O Tvůrci</h1>
      <p style="color:var(--text-muted); font-size:0.95rem;">Základní informace o vývoji a tvůrcích portálu D3po.tv.</p>

      <div class="credits-box">
        <div class="credit-item">
          <span>💻</span> @sotouszopavy
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted);">ve spolupráci s</div>
        <div class="credit-item">
          <span>🛠️</span> @tadeax_studio.cz
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted);">a</div>
        <div class="credit-item">
          <span>🤖</span> GeminiAI
        </div>
      </div>
    </main>

    <footer>
      <span>© 2026 D3po.tv</span>
      <div style="display:flex; gap:14px; flex-wrap:wrap;">
        <a href="https://d3potv.github.io/depotv/">Domů</a>
        <a href="https://d3potv.github.io/depotv/blogy">Blogy</a>
        <a href="https://d3potv.github.io/depotv/projekty">Projekty</a>
        <a href="https://d3potv.github.io/depotv/odkazy">Odkazy</a>
      </div>
    </footer>
  </div>

</body>
</html>
